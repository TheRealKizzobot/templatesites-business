name: Build and Test All Sites

on:
  push:
    branches: [main, testing, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site:
          - restaurant-site
          - taskflow-saas
          - booking-system
          - ecommerce-store
          - analytics-dashboard
          - moshine-portfolio
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - name: Install and Build
        run: |
          cd ${{ matrix.site }}
          npm install
          npm run vercel-build
