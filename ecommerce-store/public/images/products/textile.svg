<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Folded textile illustration">
  <rect width="800" height="800" fill="#faf8f6"/>
  <rect x="0" y="0" width="800" height="800" fill="none" stroke="#f0ece8" stroke-width="2"/>
  <ellipse cx="400" cy="640" rx="230" ry="20" fill="#efe9e2"/>
  <!-- blanket bulk -->
  <path d="M 180 560 Q 180 360 400 360 Q 620 360 620 560 Q 620 660 400 660 Q 180 660 180 560 Z" fill="#a4675a"/>
  <path d="M 180 560 Q 180 360 400 360 Q 620 360 620 560 Q 620 660 400 660 Q 180 660 180 560 Z" fill="url(#tShade)" opacity="0.3"/>
  <!-- fold highlight -->
  <path d="M 220 560 Q 220 420 400 420 Q 580 420 580 560" fill="none" stroke="#c98f72" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <!-- plaid stripes -->
  <rect x="0" y="470" width="800" height="18" fill="#7a4a40" opacity="0.45"/>
  <rect x="0" y="530" width="800" height="14" fill="#7a4a40" opacity="0.35"/>
  <rect x="0" y="588" width="800" height="18" fill="#7a4a40" opacity="0.45"/>
  <rect x="300" y="360" width="16" height="300" fill="#7a4a40" opacity="0.4"/>
  <rect x="470" y="360" width="16" height="300" fill="#7a4a40" opacity="0.4"/>
  <!-- fringe -->
  <g stroke="#c98f72" stroke-width="5" stroke-linecap="round">
    <line x1="196" y1="648" x2="188" y2="682"/>
    <line x1="228" y1="656" x2="224" y2="690"/>
    <line x1="260" y1="660" x2="258" y2="694"/>
    <line x1="560" y1="660" x2="562" y2="694"/>
    <line x1="592" y1="654" x2="596" y2="688"/>
    <line x1="622" y1="646" x2="630" y2="678"/>
  </g>
  <defs>
    <linearGradient id="tShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
</svg>