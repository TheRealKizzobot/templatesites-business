  <g>
    <ellipse cx="400" cy="320" rx="12" ry="14" fill="#7a5638"/>
    <path d="M 400 276 Q 406 304 400 320 Q 394 304 400 276 Z" fill="#3b312c"/>
    <path d="M 400 272 C 404 284 396 284 400 272 Z" fill="#e8a45c"/>
