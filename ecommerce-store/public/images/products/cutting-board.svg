<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Bamboo cutting board illustration">
  <rect width="800" height="800" fill="#faf8f6"/>
  <rect x="0" y="0" width="800" height="800" fill="none" stroke="#f0ece8" stroke-width="2"/>
  <ellipse cx="400" cy="680" rx="300" ry="18" fill="#efe9e2"/>
  <!-- board body -->
  <rect x="160" y="260" width="480" height="340" rx="28" fill="#c9a87a"/>
  <rect x="160" y="260" width="480" height="340" rx="28" fill="url(#woodShade)" opacity="0.3"/>
  <!-- bamboo grain strips -->
  <g stroke="#a8855a" stroke-width="2" opacity="0.5">
    <line x1="180" y1="280" x2="620" y2="280"/>
    <line x1="180" y1="330" x2="620" y2="330"/>
    <line x1="180" y1="380" x2="620" y2="380"/>
    <line x1="180" y1="430" x2="620" y2="430"/>
    <line x1="180" y1="480" x2="620" y2="480"/>
    <line x1="180" y1="530" x2="620" y2="530"/>
    <line x1="180" y1="580" x2="620" y2="580"/>
  </g>
  <!-- juice groove -->
  <rect x="220" y="300" width="360" height="220" rx="18" fill="none" stroke="#a8855a" stroke-width="6" opacity="0.6"/>
  <!-- handle cutout -->
  <path d="M 260 260 L 260 220 Q 260 200 280 200 L 520 200 Q 540 200 540 220 L 540 260" fill="none" stroke="#a8855a" stroke-width="10" stroke-linecap="round"/>
  <circle cx="400" cy="230" r="8" fill="#faf8f6" stroke="#a8855a" stroke-width="4"/>
  <!-- edge chamfer highlight -->
  <rect x="160" y="260" width="480" height="14" rx="8" fill="#d9b98a" opacity="0.7"/>
  <rect x="160" y="572" width="480" height="14" rx="8" fill="#8a6a45" opacity="0.5"/>
  <defs>
    <linearGradient id="woodShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
</svg>