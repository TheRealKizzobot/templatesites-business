<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Ceramic vase illustration">
  <rect width="800" height="800" fill="#faf8f6"/>
  <rect x="0" y="0" width="800" height="800" fill="none" stroke="#f0ece8" stroke-width="2"/>
  <ellipse cx="400" cy="700" rx="160" ry="20" fill="#efe9e2"/>
  <!-- vase body -->
  <path d="M 308 250 C 300 460 268 556 300 636 C 322 692 478 692 500 636 C 532 556 500 460 492 250 Z" fill="#b97a5e"/>
  <path d="M 308 250 C 300 460 268 556 300 636 C 322 692 478 692 500 636 C 532 556 500 460 492 250 Z" fill="url(#potShade)" opacity="0.35"/>
  <!-- rim -->
  <ellipse cx="400" cy="250" rx="96" ry="22" fill="#a5674d"/>
  <ellipse cx="400" cy="246" rx="76" ry="14" fill="#c98f72"/>
  <!-- neck -->
  <rect x="368" y="196" width="64" height="60" rx="12" fill="#b97a5e"/>
  <!-- decorative band -->
  <rect x="344" y="448" width="112" height="16" rx="8" fill="#f0ece8" opacity="0.85"/>
  <rect x="360" y="500" width="80" height="8" rx="4" fill="#f0ece8" opacity="0.6"/>
  <defs>
    <linearGradient id="potShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
</svg>