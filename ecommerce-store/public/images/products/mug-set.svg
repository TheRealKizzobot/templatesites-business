<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Ceramic mug set illustration">
  <rect width="800" height="800" fill="#faf8f6"/>
  <rect x="0" y="0" width="800" height="800" fill="none" stroke="#f0ece8" stroke-width="2"/>
  <ellipse cx="400" cy="660" rx="280" ry="20" fill="#efe9e2"/>
  <!-- mug 1 (front) -->
  <path d="M 256 520 L 272 320 Q 400 296 528 320 L 544 520 Q 400 556 256 520 Z" fill="#e8e2d8"/>
  <path d="M 256 520 L 272 320 Q 400 296 528 320 L 544 520 Q 400 556 256 520 Z" fill="url(#mShade)" opacity="0.3"/>
  <path d="M 520 340 Q 560 360 560 420 Q 560 480 520 500" fill="none" stroke="#cfc8bc" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="400" cy="320" rx="128" ry="16" fill="#d8d0c4"/>
  <!-- mug 2 (back left) -->
  <path d="M 176 470 L 188 340 Q 280 324 368 340 L 380 470 Q 280 496 176 470 Z" fill="#dcd5ca"/>
  <path d="M 176 470 L 188 340 Q 280 324 368 340 L 380 470 Q 280 496 176 470 Z" fill="url(#mShade)" opacity="0.25"/>
  <ellipse cx="280" cy="340" rx="96" ry="12" fill="#cfc7bb"/>
  <!-- mug 3 (back right) -->
  <path d="M 412 470 L 424 340 Q 512 324 600 340 L 612 470 Q 512 496 412 470 Z" fill="#dcd5ca"/>
  <path d="M 412 470 L 424 340 Q 512 324 600 340 L 612 470 Q 512 496 412 470 Z" fill="url(#mShade)" opacity="0.25"/>
  <ellipse cx="512" cy="340" rx="96" ry="12" fill="#cfc7bb"/>
  <!-- saucer under front mug -->
  <ellipse cx="400" cy="540" rx="170" ry="22" fill="#d8d0c4"/>
  <ellipse cx="400" cy="536" rx="150" ry="16" fill="#efe9e2"/>
  <defs>
    <linearGradient id="mShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
