<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Willow armchair illustration">
  <rect width="800" height="800" fill="#faf8f6"/>
  <rect x="0" y="0" width="800" height="800" fill="none" stroke="#f0ece8" stroke-width="2"/>
  <!-- ground shadow -->
  <ellipse cx="400" cy="690" rx="220" ry="26" fill="#efe9e2"/>
  <!-- legs -->
  <rect x="248" y="520" width="26" height="150" rx="10" fill="#8a6f5c"/>
  <rect x="526" y="520" width="26" height="150" rx="10" fill="#8a6f5c"/>
  <!-- seat base -->
  <rect x="222" y="452" width="356" height="86" rx="24" fill="#a98f82"/>
  <rect x="222" y="452" width="356" height="86" rx="24" fill="url(#seatShade)" opacity="0.4"/>
  <!-- cushion -->
  <rect x="238" y="414" width="324" height="58" rx="22" fill="#c4b7ae"/>
  <rect x="238" y="414" width="324" height="58" rx="22" fill="url(#cushShade)" opacity="0.35"/>
  <!-- armrests -->
  <rect x="196" y="330" width="52" height="196" rx="24" fill="#5a4a42"/>
  <rect x="552" y="330" width="52" height="196" rx="24" fill="#5a4a42"/>
  <rect x="198" y="356" width="48" height="52" rx="22" fill="#6e5b51"/>
  <rect x="554" y="356" width="48" height="52" rx="22" fill="#6e5b51"/>
  <!-- back -->
  <rect x="238" y="150" width="324" height="286" rx="60" fill="#6e5b51"/>
  <rect x="254" y="168" width="292" height="250" rx="50" fill="#5a4a42"/>
  <rect x="270" y="186" width="260" height="214" rx="42" fill="#a98f82" opacity="0.28"/>
  <!-- back tuft lines -->
  <rect x="312" y="240" width="176" height="6" rx="3" fill="#4a3d37" opacity="0.6"/>
  <rect x="312" y="300" width="176" height="6" rx="3" fill="#4a3d37" opacity="0.6"/>
  <rect x="312" y="360" width="176" height="6" rx="3" fill="#4a3d37" opacity="0.6"/>
  <!-- throw pillow -->
  <rect x="330" y="382" width="140" height="22" rx="11" fill="#c4b7ae"/>
  <defs>
    <linearGradient id="seatShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="cushShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
</svg>