  - main [ref=f51e9]:
    - region [ref=f51e10]:
      - generic [ref=f51e12]:
        - paragraph [ref=f51e13]: Ember & Wood · Wood-fired kitchen & natural wine
        - heading "Reserve your table" [level=1] [ref=f51e14]
        - paragraph [ref=f51e15]: Seasonal plates cooked over live fire, in a room that feels like a slow Sunday afternoon. Tuesday to Sunday, lunch and dinner.
        - link "Book a table" [ref=f51e17] [cursor=pointer]:
          - /url: "#book"
    - region [ref=f51e18]:
      - generic [ref=f51e19]:
        - generic [ref=f51e20]:
          - heading "Cooked over fire, poured by the glass" [level=2] [ref=f51e21]
          - paragraph [ref=f51e22]: We roast, sear, and smoke over a single wood fireplace in the middle of the room. Menus change with the market — what arrives in the morning decides what we cook that night.
          - paragraph [ref=f51e23]: The wine list leans natural and low-intervention, with a rotating roster by the glass. Sixteen seats at the bar, thirty-two at the tables, and one long counter for those who want to watch the fire.
          - paragraph [ref=f51e24]: Every booking is confirmed by email, and we seat on a first-confirmed basis — so reserve early, especially for dinner.
        - img "Flat illustration of Ember & Wood's wood-fired dining room" [ref=f51e26]
    - region [ref=f51e27]:
      - generic [ref=f51e28]:
        - heading "Signature dishes" [level=2] [ref=f51e29]
        - paragraph [ref=f51e30]: A few plates that never leave the menu. The rest changes with the market every week.
        - list [ref=f51e31]:
          - listitem [ref=f51e32]:
            - heading "Wood-Roasted Half Chicken" [level=3] [ref=f51e33]
