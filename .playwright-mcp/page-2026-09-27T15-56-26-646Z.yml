            - heading "A neighborhood table, tended with fire." [level=2] [ref=f79e45]
            - paragraph [ref=f79e46]: "Ember & Wood began in 2012 with a single oak-burning hearth and a stubborn idea: dinner should taste like the place it comes from. We cook over live wood every night, let the seasons write the menu, and keep the room small enough that every plate feels personal."
            - paragraph [ref=f79e47]: Twelve years later the hearth is still the first thing we light. Our butchers, bakers and the long-time regulars at the bar are the heart of it — everything else is just smoke and patience.
