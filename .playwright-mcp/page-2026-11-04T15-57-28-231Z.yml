          - generic [ref=f33e26]:
            - heading "1. What Are Cookies" [level=2] [ref=f33e27]
            - paragraph [ref=f33e28]: Cookies are small text files stored on your device when you visit our website. They help us provide you with a better experience and understand how you use our services.
          - generic [ref=f33e29]:
            - heading "2. How We Use Cookies" [level=2] [ref=f33e30]
            - paragraph [ref=f33e31]: "We use cookies for the following purposes:"
            - list [ref=f33e32]:
              - listitem [ref=f33e33]:
                - strong [ref=f33e34]: "Essential cookies:"
                - text: Required for the website to function properly, including session management and security.
              - listitem [ref=f33e35]:
                - strong [ref=f33e36]: "Functionality cookies:"
                - text: Remember your preferences and settings.
              - listitem [ref=f33e37]:
                - strong [ref=f33e38]: "Analytics cookies:"
                - text: Help us understand how visitors interact with our website.
              - listitem [ref=f33e39]:
                - strong [ref=f33e40]: "Application data cookies:"
                - text: For our demo templates (Northlight Goods, Book & Dine, Metrics), we store application data like cart items, bookings, and dashboard settings in cookies for demonstration purposes.
          - generic [ref=f33e41]:
            - heading "3. Demo Template Data Storage" [level=2] [ref=f33e42]
            - paragraph [ref=f33e43]: "Our demo templates use cookies to store data locally in your browser for demonstration purposes. This includes:"
            - list [ref=f33e44]:
              - listitem [ref=f33e45]:
                - strong [ref=f33e46]: "Northlight Goods (E-commerce):"
                - text: Shopping cart contents, product catalog data, and order information
              - listitem [ref=f33e47]:
                - strong [ref=f33e48]: "Book & Dine (Reservations):"
                - text: Booking information and reservation data
              - listitem [ref=f33e49]:
                - strong [ref=f33e50]: "Metrics (Analytics):"
                - text: Dashboard settings and analytics data
            - paragraph [ref=f33e51]: This data is stored only in your browser cookies and is not transmitted to external servers. Each user has their own isolated data that others cannot see.
          - generic [ref=f33e52]:
            - heading "4. Managing Cookies" [level=2] [ref=f33e53]
            - paragraph [ref=f33e54]: You can control and/or delete cookies as you wish. You can delete all cookies that are already on your computer and you can set most browsers to prevent them from being placed. However, if you do this, you may have to manually adjust some preferences every time you visit our site and some services and functionalities may not work.
