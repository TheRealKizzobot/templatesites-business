      - generic [ref=f12e20]:
        - paragraph [ref=f12e21]: Ember & Wood · Wood-fired kitchen & natural wine
        - heading "Reserve your table" [level=1] [ref=f12e22]
        - paragraph [ref=f12e23]: Seasonal plates cooked over live fire, in a room that feels like a slow Sunday afternoon. Tuesday to Sunday, lunch and dinner.
        - link "Book a table" [ref=f12e25] [cursor=pointer]:
          - /url: "#book"
    - region [ref=f12e33]:
      - generic [ref=f12e34]:
        - generic [ref=f12e35]:
          - heading "Cooked over fire, poured by the glass" [level=2] [ref=f12e36]
          - paragraph [ref=f12e37]: We roast, sear, and smoke over a single wood fireplace in the middle of the room. Menus change with the market — what arrives in the morning decides what we cook that night.
          - paragraph [ref=f12e38]: The wine list leans natural and low-intervention, with a rotating roster by the glass. Sixteen seats at the bar, thirty-two at the tables, and one long counter for those who want to watch the fire.
          - paragraph [ref=f12e39]: Every booking is confirmed by email, and we seat on a first-confirmed basis — so reserve early, especially for dinner.
        - img "Flat illustration of Ember & Wood's wood-fired dining room" [ref=f12e41]
    - region [ref=f12e42]:
      - generic [ref=f12e43]:
        - heading "Signature dishes" [level=2] [ref=f12e44]
        - paragraph [ref=f12e45]: A few plates that never leave the menu. The rest changes with the market every week.
