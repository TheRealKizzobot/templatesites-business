        - generic [ref=f45e544]:
          - generic [ref=f45e545]:
            - heading "1. Information We Collect" [level=2] [ref=f45e546]
            - paragraph [ref=f45e547]: "When you interact with MoshineSites, we may collect:"
            - list [ref=f45e548]:
              - listitem [ref=f45e549]: Contact information (name, email, phone) when you submit forms
              - listitem [ref=f45e550]: Account information if you create an account
              - listitem [ref=f45e551]: Order and payment information for purchases
              - listitem [ref=f45e552]: Technical data (IP address, browser type, pages visited) via standard web analytics
              - listitem [ref=f45e553]: Any information you voluntarily provide
          - generic [ref=f45e554]:
            - heading "2. How We Use Your Information" [level=2] [ref=f45e555]
            - list [ref=f45e556]:
              - listitem [ref=f45e557]: To provide and improve our services
              - listitem [ref=f45e558]: To process orders and manage accounts
              - listitem [ref=f45e559]: To communicate about orders, updates, and support
              - listitem [ref=f45e560]: To comply with legal obligations
              - listitem [ref=f45e561]: To send relevant updates (you can unsubscribe anytime)
          - generic [ref=f45e562]:
            - heading "3. Data Sharing" [level=2] [ref=f45e563]
            - paragraph [ref=f45e564]: "We do not sell your personal information. We may share data with:"
            - list [ref=f45e565]:
              - listitem [ref=f45e566]: Payment processors for transactions
              - listitem [ref=f45e567]: Hosting providers (Vercel) for site deployment
              - listitem [ref=f45e568]: Legal authorities when required by law
          - generic [ref=f45e569]:
            - heading "4. Data Retention" [level=2] [ref=f45e570]
            - paragraph [ref=f45e571]: "We retain account and order data as long as your account is active or as needed for legal compliance. Analytics data is retained per provider policies (Vercel: 30 days). You may request deletion at any time."
          - generic [ref=f45e572]:
            - heading "5. Your Rights" [level=2] [ref=f45e573]
            - paragraph [ref=f45e574]: You may request access, correction, or deletion of your personal data by contacting us.
          - generic [ref=f45e575]:
